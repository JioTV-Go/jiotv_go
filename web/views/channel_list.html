{{define "channel_list"}}
<div>
  <label
    for="hide-locked-toggle"
    class="flex cursor-pointer items-center gap-2.5 px-4 pt-3 text-sm text-base-content/70"
  >
    <input
      id="hide-locked-toggle"
      type="checkbox"
      class="checkbox checkbox-sm checkbox-primary"
      onchange="toggleLockedChannels(this.checked)"
    />
    <span>Hide channels requiring a separate subscription</span>
    <span id="locked-channel-count" class="ml-auto text-xs text-base-content/50"></span>
  </label>
  <div id="favorite-channels-section" class="px-4 pt-6" style="display: none;">
    <h2 class="section-title mb-3">Favourites</h2>
    <div id="favorite-channels-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
      <!-- Favorite channels will be moved here by JavaScript -->
    </div>
    <h2 class="section-title mt-8 mb-3">All Channels</h2>
  </div>
  <div id="original-channels-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4 p-4">
    {{range $channel := .Channels}}
    <a
      href="/play/{{$channel.ID}}"
      class="card relative overflow-hidden border border-primary bg-base-100 shadow-sm group"
      data-channel-id="{{$channel.ID}}"
      data-channel-name="{{$channel.Name}}"
      data-catchup-available="{{if $channel.IsCatchupAvailable}}true{{else}}false{{end}}"
      {{if $channel.RequiresSubscription}}data-requires-subscription="true"{{end}}
      tabindex="0"
    >
      <div class="logo-tile relative w-full aspect-[4/3] overflow-hidden">
        <img
          src="{{$channel.LogoURL}}"
          loading="lazy"
          alt="{{$channel.Name}}"
          class="h-full w-full object-contain p-4 transition-transform duration-300 group-hover:scale-110"
        />
        {{if $channel.RequiresSubscription}}
        <span
          class="badge badge-sm absolute top-2 left-2 z-10 gap-1 border-0 text-[0.65rem] bg-base-100/85 text-base-content/80 shadow-sm backdrop-blur-sm"
          title="May require a separate subscription"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-2.5 w-2.5" aria-hidden="true">
            <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z" clip-rule="evenodd" />
          </svg>
          Subscription
        </span>
        {{else}}
        <span class="live-badge absolute top-2 left-2 z-10">LIVE</span>
        {{end}}
      </div>
      <div class="px-2.5 py-2.5 border-t border-base-300/40">
        <p class="now-playing hidden text-center leading-snug line-clamp-1">
          <span class="font-semibold text-primary">Now:</span>
          <span class="now-title text-sm font-bold"></span>
        </p>
      </div>
      <button id="favorite-btn-{{$channel.ID}}" class="favorite-btn absolute btn btn-ghost btn-circle bg-base-100/80 backdrop-blur-sm top-2 right-2 z-10 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity duration-200" aria-label="Add to favorites" onclick="event.preventDefault(); toggleFavorite('{{$channel.ID}}');">
        <svg  id="star-icon-{{$channel.ID}}" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
        </svg>

        <svg id="x-icon-{{$channel.ID}}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-6 h-6 hidden">
          <path fill-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z" clip-rule="evenodd" />
        </svg>
      </button>
    </a>
    {{end}}
  </div>
  <button
    class="btn btn-primary btn-circle sm:w-auto sm:px-4 fixed bottom-24 right-5 md:bottom-6 z-40 shadow-lg focus:outline-hidden flex flex-row gap-2 sm:rounded-full"
    onclick="scrollToTop()"
    aria-label="Scroll to top"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="1.8"
      stroke="currentColor"
      class="w-5 h-5 shrink-0"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
    </svg>
    <span class="hidden sm:block">Top</span>
  </button>
  <div id="locked_channel_modal" class="modal modal-bottom sm:modal-middle" role="dialog" aria-modal="true" aria-labelledby="locked-channel-title" aria-describedby="locked-channel-message">
    <div class="modal-box pb-[calc(1.5rem+env(safe-area-inset-bottom))] text-center">
      <span class="mx-auto flex size-12 items-center justify-center rounded-full bg-warning/15 text-warning">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="size-6" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z" />
        </svg>
      </span>
      <h3 id="locked-channel-title" class="mt-3 font-bold text-xl tracking-tight">Subscription may be required</h3>
      <p id="locked-channel-message" class="py-3 text-sm text-base-content/60"></p>
      <div class="modal-action grid grid-cols-2 gap-2">
        <button id="locked-channel-cancel" type="button" class="btn">Cancel</button>
        <button id="locked-channel-continue" type="button" class="btn btn-primary">Try anyway</button>
      </div>
    </div>
    <button id="locked-channel-backdrop" type="button" class="modal-backdrop" aria-label="Close subscription notice"></button>
  </div>
  <script src="/static/internal/utils.js"></script>
  <script src="/static/internal/channels.js"></script>
  <script>
    // Hiding is done with a class on <body> rather than per-element display,
    // because the search filter owns each card's inline style.display.
    const LOCKED_CHANNELS_STORAGE_KEY = "hideLockedChannels";

    function toggleLockedChannels(shouldHide) {
      document.body.classList.toggle("hide-locked-channels", shouldHide);
      setLocalStorageItem(LOCKED_CHANNELS_STORAGE_KEY, shouldHide);
    }

    (() => {
      const lockedCount = document.querySelectorAll('[data-requires-subscription="true"]').length;
      const countLabel = document.getElementById("locked-channel-count");
      if (countLabel) {
        countLabel.textContent = lockedCount ? lockedCount + " need a subscription" : "";
      }

      const toggle = document.getElementById("hide-locked-toggle");
      if (!toggle) return;
      if (!lockedCount) {
        toggle.closest("label").style.display = "none";
        return;
      }

      const stored = getLocalStorageItem(LOCKED_CHANNELS_STORAGE_KEY, false) === true;
      toggle.checked = stored;
      toggleLockedChannels(stored);
      initSubscriptionWarnings();
    })();
  </script>
</div>
{{end}}
